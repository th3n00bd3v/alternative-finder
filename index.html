<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="A searchable directory of open source alternatives to popular software, browsers, productivity tools, and AI assistants.">
  <title>Alternative Tools Directory</title>
  <script>
    (function () {
      const root = document.documentElement;
      root.classList.add("booting");

      try {
        const storedTheme = localStorage.getItem("color-theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const shouldUseDark = storedTheme === "dark" || (!storedTheme && prefersDark);
        root.classList.toggle("dark", shouldUseDark);
      } catch (error) {
        root.classList.remove("dark");
      }
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/data.js"></script>
  <script src="js/render.js"></script>
  <script src="js/interactions.js"></script>
  <script src="js/script.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#tools-container">Skip to results</a>

  <div class="theme-actions" role="group" aria-label="Quick actions">
    <button id="back-to-top" type="button" aria-label="Back to top" class="hidden">
      <svg aria-hidden="true" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 10l7-7m0 0l7 7m-7-7v18"></path>
      </svg>
    </button>
    <button id="theme-toggle" type="button" aria-label="Toggle color theme">
      <svg id="theme-toggle-dark-icon" aria-hidden="true" class="hidden" width="20" height="20" fill="currentColor" viewBox="0 0 20 20">
        <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
      </svg>
      <svg id="theme-toggle-light-icon" aria-hidden="true" class="hidden" width="20" height="20" fill="currentColor" viewBox="0 0 20 20">
        <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 001.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"></path>
      </svg>
    </button>
  </div>

  <div class="page-shell">
    <header class="site-header">
      <div>
        <h1 class="site-title">Alternative Tools Directory</h1>
        <p class="site-tagline">Discover open source alternatives to popular software. Search by tool, category, or alternative name.</p>
        <p class="site-stats" id="directory-stats"></p>
      </div>

      <div class="controls-panel surface-panel">
        <div class="search-bar">
          <label class="sr-only" for="search">Search tools and alternatives</label>
          <input class="field-control" type="search" id="search" placeholder="Search tools and alternatives..." autocomplete="off">
          <label class="sr-only" for="category-filter">Filter by category</label>
          <select class="field-control" id="category-filter">
            <option value="">All Categories</option>
          </select>
          <button class="control-btn" type="button" id="clear-filters">
            <svg class="control-icon" aria-hidden="true" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
            Clear
          </button>
        </div>

        <div class="controls-row">
          <button class="control-btn" type="button" id="sort-category" aria-pressed="false">
            <svg class="control-icon" aria-hidden="true" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 7h6l2 2h10M3 17h10l2-2h6"></path>
            </svg>
            Category
            <span class="sort-direction" data-direction hidden>&#9650;</span>
          </button>
          <button class="control-btn" type="button" id="sort-name" aria-pressed="false">
            <svg class="control-icon" aria-hidden="true" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M4 12h10M4 17h6"></path>
            </svg>
            Name
            <span class="sort-direction" data-direction hidden>&#9650;</span>
          </button>
          <button class="control-btn" type="button" id="toggle-expand" aria-pressed="false">
            <svg class="control-icon" aria-hidden="true" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 4h13M8 12h13M8 20h13M3 4h.01M3 12h.01M3 20h.01"></path>
            </svg>
            <span id="toggle-expand-label">Expand all</span>
          </button>
        </div>
      </div>
    </header>

    <main id="tools-container">
      <div class="section-heading">
        <h2 class="section-title">Categories</h2>
        <p class="results-status" id="results-status" aria-live="polite"></p>
      </div>
      <div class="category-list-shell" id="category-list"></div>
    </main>

    <footer id="main-footer" class="site-footer"></footer>
  </div>
</body>
</html>
